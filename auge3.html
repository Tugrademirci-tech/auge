<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TumyE</title>
<style>
:root{--bg:#05080e;--text:#cfe9f2;--mute:#6f8794;--panel:#101822;--line:#22303d;--accent:#4fd8ff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:hidden}
#state{font-size:.85rem;color:var(--mute);letter-spacing:.06em;text-align:center;min-height:1.4em;font-weight:bold}
canvas#eye{width:min(94vw,62vh);height:min(94vw,62vh);touch-action:none}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:.85rem;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);outline:none}
button:disabled{opacity:.4}
video{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#scan{position:fixed;inset:0;background:rgba(2,8,12,.94);color:#6ff;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 16px;display:none;overflow:hidden;z-index:9;white-space:pre-wrap;font-size:13px}
#scan.on{display:block}
</style>
</head>
<body>
<div id="state">Tippe auf „Kamera starten“</div>
<canvas id="eye" width="660" height="660" aria-label="TumyE Auge"></canvas>
<div id="bar">
 <button id="bCam">Kamera starten</button>
 <button id="bEnroll" disabled>Mich merken</button>
 <button id="bScan">Scan</button>
 <button id="bChess">Schach</button>
</div>
<video id="cam" playsinline muted></video>
<div id="scan"></div>

<script>
"use strict";
/* Einstellungen */
const RAINBOW_SECONDS=6;
let GAIN_X=3.2, GAIN_Y=3.4; // Dynamische Empfindlichkeit

const $=id=>document.getElementById(id);
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let owner=store.get("owner", null); // Enthält { name: "Tugra", desc: [...] }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lastStatus=""; function status(t){if(t!==lastStatus){lastStatus=t;$("state").textContent=t}}

/* ---------- Farben ---------- */
const PAL={
 neutral:[[92,94,100],[170,172,178],[135,138,145],[60,62,68]],
 wut:[[60,5,5],[225,35,20],[150,10,10],[40,0,0]],
 freude:[[10,60,20],[70,215,90],[40,150,70],[10,50,25]],
 angst:[[45,75,105],[150,215,255],[105,175,235],[35,65,95]],
 scan:[[10,50,60],[40,200,210],[40,140,200],[10,40,60]]};
let pal=JSON.parse(JSON.stringify(PAL.neutral)),palT=PAL.neutral;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

/* ---------- Zustand ---------- */
let tgt={x:0,y:0},cur={x:0,y:0},ptr={x:0,y:0},ptrT=0,wx=0,wy=0,wanderT=0;
let blink=0,nextBlink=2,dil=.42,dilT=.42,t0=performance.now();
let red=0,redT=0,slp=0,slpT=0,bright=128,rb=0,rbT=0,rbUntil=0,lastFace=0;
let camOn=false,scanning=false,emoName="neutral";
let detectedName=""; // Wer gerade vor der Kamera steht

/* ---------- Auge Zeichnen ---------- */
const cv=$("eye"),cx=cv.getContext("2d"),W=660,C=W/2,R=250;
function drawEye(t){
 const now=performance.now(),dt=Math.min(.05,(t-t0)/1000);t0=t;
 const faceNow=now-lastFace<1500;
 let T=tgt;
 if(!faceNow){
  if(now-ptrT<4000)T=ptr;
  else{wanderT-=dt;if(wanderT<0){wx=(Math.random()-.5)*1.3;wy=(Math.random()-.5)*.8;wanderT=1.4+Math.random()*3}T={x:wx,y:wy}}
 }
 const rate=faceNow?20:7;
 cur.x+=(T.x-cur.x)*Math.min(1,dt*rate);cur.y+=(T.y-cur.y)*Math.min(1,dt*rate);
 dil+=(dilT-dil)*Math.min(1,dt*5);
 red+=(redT-red)*Math.min(1,dt*2);slp+=(slpT-slp)*Math.min(1,dt*1.5);rb+=(rbT-rb)*Math.min(1,dt*3);
 const target=scanning?PAL.scan:palT;
 for(let i=0;i<4;i++)pal[i]=pal[i].map((v,j)=>v+(target[i][j]-v)*Math.min(1,dt*4));
 nextBlink-=dt;if(nextBlink<0){blink=1;nextBlink=2+Math.random()*4}
 blink=Math.max(0,blink-dt*5);
 cx.clearRect(0,0,W,W);
 
 // HUD-Ringe
 const hc=mix(mix([90,220,255],pal[1],.55),[255,60,50],red);
 cx.save();cx.translate(C,C);cx.lineCap="round";
 for(let k=0;k<3;k++){cx.save();cx.rotate(t/1000*(k%2?-.35:.25)*(k+1)*.6);cx.strokeStyle=`rgba(${hc[0]},${hc[1]},${hc[2]},${.55-k*.14})`;cx.lineWidth=3-k*.7;cx.setLineDash([k?6:60,k?10:24+k*10]);cx.beginPath();cx.arc(0,0,272+k*16,0,7);cx.stroke();cx.restore()}
 cx.restore();
 
 // Augapfel
 let g=cx.createRadialGradient(C-90,C-100,20,C,C,R);
 g.addColorStop(0,"#fbf8f0");g.addColorStop(.7,"#e4ddd0");g.addColorStop(1,"#a99f90");
 cx.fillStyle=g;cx.beginPath();cx.arc(C,C,R,0,7);cx.fill();
 cx.save();cx.beginPath();cx.arc(C,C,R,0,7);cx.clip();
 cx.strokeStyle="rgba(170,60,50,.22)";cx.lineWidth=2;
 for(let i=0;i<14;i++){const a=i*.45+cur.x*.9;cx.beginPath();cx.moveTo(C+Math.cos(a)*R,C+Math.sin(a)*R);cx.quadraticCurveTo(C+Math.cos(a+.2)*R*.82,C+Math.sin(a+.2)*R*.82,C+Math.cos(a+.1)*R*.68,C+Math.sin(a+.1)*R*.68);cx.stroke()}
 const lim=.64,ex=Math.max(-1,Math.min(1,cur.x)),ey=Math.max(-1,Math.min(1,cur.y));
 const px=C+ex*R*lim,py=C+ey*R*lim*.85;
 const ang=Math.atan2(py-C,px-C),dist=Math.hypot(px-C,py-C)/R;
 const sq=Math.cos(Math.min(1.2,dist*1.1)),ir=118;
 cx.translate(px,py);cx.rotate(ang);cx.scale(Math.max(.45,sq),1);
 const c1=mix(pal[0],[70,0,0],red),c2=mix(pal[1],[210,30,25],red),c3=mix(pal[2],[140,10,10],red),c4=mix(pal[3],[30,0,0],red);
 let ig=cx.createRadialGradient(0,0,10,0,0,ir);
 ig.addColorStop(0,rgb(c1));ig.addColorStop(.3,rgb(c2));ig.addColorStop(.72,rgb(c3));ig.addColorStop(1,rgb(c4));
 cx.fillStyle=ig;cx.beginPath();cx.arc(0,0,ir,0,7);cx.fill();
 if(rb>.02&&cx.createConicGradient){
  const cg=cx.createConicGradient(t/1500,0,0);
  for(let i=0;i<=8;i++)cg.addColorStop(i/8,`hsla(${(i*45+t/12)%360},95%,55%,${rb*.88})`);
  cx.fillStyle=cg;cx.beginPath();cx.arc(0,0,ir,0,7);cx.fill();
 }
 cx.save();cx.rotate(-ang+t/9000);
 for(let i=0;i<110;i++){const a=i/110*6.283+Math.sin(i*12.9)*.02,r0=ir*(.3+.05*Math.sin(i*3.1)),r1=ir*(.72+.24*Math.abs(Math.sin(i*1.7+1)));
  cx.strokeStyle=i%3?"rgba(255,240,210,.22)":"rgba(0,0,0,.28)";cx.lineWidth=i%3?1.6:2.4;
  cx.beginPath();cx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);cx.lineTo(Math.cos(a+.03)*r1,Math.sin(a+.03)*r1);cx.stroke()}
 for(let i=0;i<12;i++){const a=i*2.4,r=ir*(.5+.3*Math.abs(Math.sin(i*5.3)));cx.fillStyle="rgba(0,0,0,.2)";cx.beginPath();cx.ellipse(Math.cos(a)*r,Math.sin(a)*r,ir*.07,ir*.03,a,0,7);cx.fill()}
 cx.restore();
 cx.strokeStyle="rgba(255,245,220,.34)";cx.lineWidth=3;cx.beginPath();
 for(let i=0;i<=120;i++){const a=i/120*6.283,r=ir*(.52+.025*Math.sin(a*9+t/2000));i?cx.lineTo(Math.cos(a)*r,Math.sin(a)*r):cx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
 cx.stroke();
 cx.strokeStyle="rgba(4,14,16,.9)";cx.lineWidth=12;cx.beginPath();cx.arc(0,0,ir,0,7);cx.stroke();
 const pr=ir*dil,k0=[3,6,9];
 const pg=cx.createRadialGradient(0,0,0,0,0,pr);
 pg.addColorStop(0,rgb(mix(k0,[255,80,60],red)));pg.addColorStop(.75,rgb(mix(k0,[190,10,10],red)));pg.addColorStop(1,rgb(mix(k0,[90,0,0],red)));
 cx.shadowColor="rgba(255,40,30,"+red+")";cx.shadowBlur=40*red;cx.fillStyle=pg;cx.beginPath();cx.arc(0,0,pr,0,7);cx.fill();cx.shadowBlur=0;
 cx.setTransform(1,0,0,1,0,0);
 cx.fillStyle="rgba(255,255,255,.85)";cx.beginPath();cx.ellipse(C-95-ex*14,C-110-ey*14,34,22,-.6,0,7);cx.fill();
 const lid=Math.max(blink<.5?blink*2:(1-blink)*2,slp);
 if(lid>0){cx.fillStyle="#1b1510";cx.fillRect(0,0,W,C*lid*1.05);cx.fillRect(0,W-C*lid*1.05,W,C*lid*1.05)}
 cx.restore();
 let sh=cx.createRadialGradient(C,C,R*.82,C,C,R*1.02);sh.addColorStop(0,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.35)");
 cx.fillStyle=sh;cx.beginPath();cx.arc(C,C,R,0,7);cx.fill();
 requestAnimationFrame(drawEye);
}
requestAnimationFrame(drawEye);

/* ---------- Finger / Touch / Mouse Reaktion ---------- */
function handlePointer(e){
 const r=cv.getBoundingClientRect();
 const clientX = e.clientX ?? e.touches?.[0]?.clientX;
 const clientY = e.clientY ?? e.touches?.[0]?.clientY;
 if(clientX === undefined || clientY === undefined) return;
 ptr.x=((clientX-r.left)/r.width-.5)*2.6;
 ptr.y=((clientY-r.top)/r.height-.5)*2.6;
 ptrT=performance.now();
}
addEventListener("pointermove",handlePointer);
addEventListener("pointerdown",handlePointer);
window.addEventListener("touchmove",handlePointer,{passive:true});
window.addEventListener("touchstart",handlePointer,{passive:true});

/* ---------- face-api & Modelle ---------- */
let FA=false,faceDet=null,vid=$("cam"),stream=null,prev=null;
const tc=document.createElement("canvas");tc.width=40;tc.height=30;const tx=tc.getContext("2d",{willReadFrequently:true});
const VERS=["1.7.15","1.7.14","1.7.12"];
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function loadFA(){
 status("Lade Gesichtserkennung …");
 for(const v of VERS){
  try{
   await loadScript("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@"+v+"/dist/face-api.js");
   const base="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@"+v+"/model/";
   await faceapi.tf.ready();
   await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(base),faceapi.nets.faceLandmark68TinyNet.loadFromUri(base),faceapi.nets.faceExpressionNet.loadFromUri(base),faceapi.nets.faceRecognitionNet.loadFromUri(base)]);
   FA=true;status("Bereit");return;
  }catch(e){}
 }
 status("Einfacher Modus aktiv");
}
const opts=()=>new faceapi.TinyFaceDetectorOptions({inputSize:256,scoreThreshold:.35});

/* Emotionen */
const es={angry:0,happy:0,fearful:0,surprised:0,neutral:1};
let emoStable=0,emoPend="neutral",isOwner=false,ownerWas=false,lastId=0;
function pickEmotion(){
 if(es.angry>.4)return "wut";
 if(es.happy>.45)return "freude";
 if(es.fearful+es.surprised*.4>.35)return "angst";
 return "neutral";
}
const baseDil=()=>(emoName==="wut"?.34:emoName==="angst"?.6:emoName==="freude"?.5:.42)+.25*redT;
function setEmotion(n){
 if(n===emoPend)emoStable++;else{emoPend=n;emoStable=0}
 if(emoStable>=2&&n!==emoName){emoName=n;palT=PAL[n]||PAL.neutral;dilT=baseDil()}
}
const NAMES={wut:"Wut",freude:"Freude",angst:"Angst",neutral:"neutral"};

/* ---------- Kamera Loop ---------- */
async function startCam(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});
  vid.srcObject=stream;await vid.play();camOn=true;
  if("FaceDetector" in window){try{faceDet=new FaceDetector({fastMode:false,maxDetectedFaces:1})}catch(e){}}
  $("bEnroll").disabled=false;$("bCam").textContent="Kamera aus";status("Kamera an");
  loop();if(!FA)loadFA();
 }catch(e){status("Kamera nicht verfügbar. Erlaube den Zugriff.")}
}
function stopCam(){camOn=false;stream&&stream.getTracks().forEach(t=>t.stop());$("bEnroll").disabled=true;$("bCam").textContent="Kamera starten";redT=0;slpT=0;rbT=0;palT=PAL.neutral;emoName="neutral";status("Kamera aus")}

async function loop(){
 if(!camOn)return;
 const now=performance.now();let found=false,raw=null;
 try{
  if(vid.videoWidth&&vid.readyState>=2){
   tx.drawImage(vid,0,0,40,30);const d=tx.getImageData(0,0,40,30).data;
   let sum=0;for(let i=0;i<d.length;i+=4)sum+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
   bright+=(sum/(d.length/4)-bright)*.3;
   redT=Math.max(0,Math.min(1,(55-bright)/30));slpT=bright<14?1:0;
   const VW=vid.videoWidth,VH=vid.videoHeight;
   
   if(FA&&!slpT){
    const det=await faceapi.detectSingleFace(vid,opts()).withFaceLandmarks(true).withFaceExpressions();
    if(det){
     const p=det.landmarks.positions;let sx=0,sy=0;for(let i=36;i<48;i++){sx+=p[i].x;sy+=p[i].y}
     const fSize=det.detection.box.width/VW;
     raw={x:sx/12/VW,y:sy/12/VH,size:fSize};found=true;
     
     // Dynamische Verfolgung im Nahbereich (wenn Gesicht näher ist)
     const dynamicGain = Math.max(2.8, Math.min(5.5, fSize * 10));
     GAIN_X = dynamicGain; GAIN_Y = dynamicGain * 1.1;

     for(const k in es)es[k]+=((det.expressions[k]||0)-es[k])*.4;
     setEmotion(pickEmotion());

     // Gesichtserkennung / Abgleich
     if(now-lastId>800){
      lastId=now;
      try{
       const r=await faceapi.detectSingleFace(vid,opts()).withFaceLandmarks(true).withFaceDescriptor();
       if(r && owner && owner.desc){
        const dist=faceapi.euclideanDistance(r.descriptor, owner.desc);
        if(dist < 0.52){
         isOwner=true;
         detectedName=owner.name || "Tugra";
        }else{
         isOwner=false;
         detectedName="Fremde Person";
        }
       }else if(r){
        isOwner=false;
        detectedName="Fremde Person";
       }
      }catch(e){}
     }
    }
   }else if(!slpT){
    if(faceDet){
     const f=await faceDet.detect(vid);
     if(f[0]){
      const b=f[0].boundingBox;
      raw={x:(b.x+b.width/2)/VW,y:(b.y+b.height*.4)/VH,size:b.width/VW};
      found=true;
      detectedName=owner?owner.name:"Erkannt";
     }
    }
   }
   prev=d;
  }
 }catch(e){}

 if(found){
  const nx=(.5-raw.x)*GAIN_X,ny=(raw.y-.5)*GAIN_Y;
  tgt.x+=(nx-tgt.x)*.7;tgt.y+=(ny-tgt.y)*.7;
  lastFace=now;
  if(FA)dilT=baseDil()-Math.max(-.08,Math.min(.1,(raw.size-.25)*.4));
 }else if(now-lastFace>2500){
  isOwner=false;
  detectedName="";
  if(emoName!=="neutral"){emoName="neutral";palT=PAL.neutral}
  for(const k in es)es[k]=k==="neutral"?1:0;
  dilT=.42+.25*redT;
 }

 const seesMe=now-lastFace<1500&&isOwner;
 if(seesMe&&!ownerWas)rbUntil=now+RAINBOW_SECONDS*1000;
 ownerWas=seesMe;
 rbT=(seesMe&&now<rbUntil)?1:0;

 // Statusanzeige oben
 let dispStatus="";
 if(slpT){
  dispStatus="Zu dunkel – Augen zu";
 }else if(now-lastFace<1500){
  if(isOwner){
   dispStatus=`Ich sehe dich, ${detectedName}!`;
  }else{
   dispStatus="Fremde Person";
  }
  if(FA) dispStatus += " · " + NAMES[emoName];
 }else{
  dispStatus = FA ? "Bereit" : lastStatus;
 }
 status(dispStatus);

 setTimeout(loop,FA?0:90);
}

/* ---------- Buttons & Aktionen ---------- */
$("bCam").onclick=()=>camOn?stopCam():startCam();

$("bEnroll").onclick=async()=>{
 if(!FA){status("Gesichtserkennung lädt noch …");return}
 
 const inputName = prompt("Wie heißt du?", owner ? owner.name : "Tugra");
 if(!inputName) return;
 
 status(`Schau direkt in die Kamera, ${inputName} …`);
 await sleep(1200);
 
 const ds=[];
 for(let i=0;i<8;i++){
  try{
   const d=await faceapi.detectSingleFace(vid,opts()).withFaceLandmarks(true).withFaceDescriptor();
   if(d) ds.push(Array.from(d.descriptor));
  }catch(e){}
  await sleep(200);
 }
 
 if(ds.length<3){
  status("Gesicht nicht gut gesehen. Versuch es noch einmal.");
  return;
 }
 
 // Mittelwert berechnen für präzisen Abgleich
 const avg=ds[0].map((_,i)=>ds.reduce((a,v)=>a+v[i],0)/ds.length);
 owner={ name: inputName, desc: avg };
 store.set("owner", owner);
 
 isOwner=true;
 detectedName=inputName;
 ownerWas=false;
 status(`Gespeichert! Hallo ${inputName}, ich erkenne dich jetzt.`);
};

$("bChess").onclick=()=>window.open("https://tugrademirci-tech.github.io/tassy/","_blank","noopener");

$("bScan").onclick=async()=>{
 const o=$("scan");o.textContent="";o.classList.add("on");scanning=true;
 let bat="n/a";try{const b=await navigator.getBattery();bat=Math.round(b.level*100)+" %"}catch(e){}
 const hx=n=>Array.from({length:n},()=>Math.floor(Math.random()*16).toString(16)).join("");
 const L=["TumyE://scan --deep --target=lokal","Verbinde mit Gerät …","Browser: "+navigator.userAgent.slice(0,60),"Plattform: "+(navigator.platform||"?"),"Bildschirm: "+screen.width+"×"+screen.height,"Sprache: "+navigator.language,"Zeitzone: "+Intl.DateTimeFormat().resolvedOptions().timeZone,"Akku: "+bat,"Kamera: "+(camOn?"aktiv":"aus"),"Fange Pakete ab …"];
 for(let i=0;i<14;i++)L.push("0x"+hx(8)+"  "+hx(32)+"  "+(Math.random()*100|0)+"%");
 L.push("Entschlüssele Kontakte … ████████░░ 80 %","Zugriff verweigert … Umgehung läuft …","Fertig.","","SHOW-EFFEKT: Das war nur eine Simulation. Es wurden keine Daten gesendet oder gespeichert. Tippe zum Schließen.");
 let i=0;const iv=setInterval(()=>{if(i>=L.length||!o.classList.contains("on")){clearInterval(iv);return}o.textContent+=L[i++]+"\n";o.scrollTop=1e9},170);
 o.onclick=()=>{o.classList.remove("on");scanning=false};
};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
